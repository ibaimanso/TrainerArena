<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Trainer Arena — Torneos online de Pokémon TCG</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Organiza y juega torneos online de Pokémon TCG: rondas suizas con timer, top cut, decklists, jueces en vivo y clasificación en tiempo real."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ta-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* SSR/privacy mode: stay light */
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
